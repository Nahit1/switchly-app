services:
  postgres_switchly_db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_switchly_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t$${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  switchly_webapi:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Switchly.WebApi/Dockerfile
    container_name: switchly_webapi
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres_switchly_db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
    ports:
      - "${API_PORT}:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres_switchly_db:
        condition: service_healthy

volumes:
  postgres_switchly_db:
    driver: local
